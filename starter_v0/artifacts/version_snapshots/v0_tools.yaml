tools:
  - name: clarify
    description: "Ask the user a question."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Question"}
        response_type: {type: string, enum: [text, yes_no, choice], default: text, description: "Response type"}
        options: {type: array, default: [], items: {type: string}, description: "Choices"}
      required: [question]

  - name: timeline
    description: "Get recent posts."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account"}
        limit: {type: integer, default: 5, description: "Count"}
      required: [screenname]

  - name: social_search
    description: "Search social media."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword"}
        search_type: {type: string, enum: [Latest, Top], default: Latest, description: "Sort"}
        limit: {type: integer, default: 5, description: "Count"}
      required: [query]

  - name: lookup
    description: "Look up information on the internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Query"}
        topic: {type: string, enum: [general, news], default: general, description: "Topic"}
        timeframe: {type: string, enum: [day, week, month, year], default: week, description: "Time range"}
        max_results: {type: integer, default: 5, description: "Result count"}
      required: [query]

  - name: fetch
    description: "Read content from an address."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Address"}
      required: [url]

  - name: format
    description: "Format existing data as text."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: sections}
        headline: {type: string, default: ""}
      required: [items, template]

  - name: send
    description: "Send a text somewhere."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text"}
        confirmed: {type: boolean, default: false, description: "Confirmation flag"}
      required: [text]

  - name: policy
    description: "Search internal documents."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: all}
        top_k: {type: integer, default: 3}
      required: [query]

  - name: papers
    description: "Search scientific papers."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword"}
        max_results: {type: integer, default: 5}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: relevance}
      required: [query]

  - name: paper_text
    description: "Get text from a paper."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID or address"}
        max_pages: {type: integer, default: 5}
        max_chars: {type: integer, default: 8000}
      required: [arxiv_url]
